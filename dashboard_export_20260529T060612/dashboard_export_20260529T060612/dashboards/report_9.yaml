css: "/* =========================\r\n   CLEAN PDF-SAFE THEME\r\n   =========================\
  \ */\r\n\r\n:root {\r\n  --bg: #f6f8fb;\r\n  --card: #ffffff;\r\n  --border: #e5e7eb;\r\
  \n  --text: #111827;\r\n  --muted: #6b7280;\r\n\r\n  --primary: #6366f1;\r\n  --green:\
  \ #16a34a;\r\n  --red: #dc2626;\r\n\r\n  --radius: 18px;\r\n\r\n  --shadow:\r\n\
  \    0 2px 10px rgba(0,0,0,0.04);\r\n}\r\n\r\n/* Dashboard background */\r\n.dashboard\
  \ {\r\n  background: var(--bg);\r\n}\r\n\r\n/* Card styling */\r\n.slice_container,\r\
  \n[data-test-chart-id] {\r\n\r\n  background: var(--card) !important;\r\n\r\n  border-radius:\
  \ var(--radius);\r\n\r\n  border: 1px solid var(--border);\r\n\r\n  box-shadow:\
  \ var(--shadow);\r\n\r\n  padding: 8px;\r\n\r\n  margin-bottom: 12px;\r\n\r\n  overflow:\
  \ hidden;\r\n}\r\n\r\n/* Spacing between charts */\r\n.dashboard-component-chart-holder\
  \ {\r\n  padding: 8px !important;\r\n}\r\n\r\n/* Rows */\r\n.grid-row {\r\n  margin-bottom:\
  \ 12px;\r\n}\r\n\r\n/* Titles */\r\n.slice_container h1,\r\n.slice_container h2,\r\
  \n.slice_container h3,\r\n.slice_container h4,\r\n.slice_container .header-title\
  \ {\r\n\r\n  color: var(--text) !important;\r\n\r\n  font-weight: 600 !important;\r\
  \n\r\n  letter-spacing: -0.02em;\r\n}\r\n\r\n/* KPI values */\r\n.big-number,\r\n\
  .header-line,\r\n.metric-value {\r\n\r\n  font-size: 28px !important;\r\n\r\n  font-weight:\
  \ 700 !important;\r\n\r\n  color: var(--primary) !important;\r\n}\r\n\r\n/* Subtitles\
  \ */\r\n.subheader,\r\n.subheader-line,\r\n.text-muted,\r\nsmall {\r\n\r\n  color:\
  \ var(--muted) !important;\r\n}\r\n\r\n/* Negative values */\r\n.negative,\r\n.text-danger\
  \ {\r\n\r\n  color: var(--red) !important;\r\n}\r\n\r\n/* Positive values */\r\n\
  .text-success {\r\n\r\n  color: var(--green) !important;\r\n}\r\n\r\n/* Tables */\r\
  \ntable {\r\n  border-radius: 12px;\r\n  overflow: hidden;\r\n}\r\n\r\n/* Tabs */\r\
  \n.ant-tabs-tab {\r\n  padding: 10px 16px !important;\r\n}\r\n\r\n.ant-tabs-content-holder\
  \ {\r\n  padding-top: 12px;\r\n}"
