sql: "SELECT\r\n    period_month AS month_date,\r\n\r\n    TO_CHAR(period_month, 'Mon\
  \ YYYY') AS period_label,\r\n\r\n    SUM(CASE WHEN category = 'net_profit' THEN\
  \ amount ELSE 0 END) AS net_profit\r\n\r\nFROM fact_financials\r\n\r\nWHERE period_month\
  \ = '2026-03-01'\r\n\r\nGROUP BY\r\n    period_month\r\n\r\nORDER BY\r\n    period_month;"
