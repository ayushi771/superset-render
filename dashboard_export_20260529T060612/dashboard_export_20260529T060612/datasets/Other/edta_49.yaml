sql: "SELECT\r\n  DATE_TRUNC('MONTH', month_date) AS month_date,\r\n  SUM(ebdt) AS\
  \ \"SUM(ebdt)\"\r\nFROM (\r\n  SELECT\r\n    period_month AS month_date,\r\n   \
  \ TO_CHAR(period_month, 'Mon YYYY') AS period_label,\r\n    SUM(CASE WHEN category\
  \ = 'ebdt' THEN amount ELSE 0 END) AS ebdt\r\n  FROM fact_financials\r\n  WHERE\r\
  \n    period_month = '2026-03-01'\r\n  GROUP BY\r\n    period_month\r\n  ORDER BY\r\
  \n    period_month\r\n) AS virtual_table\r\nGROUP BY\r\n  DATE_TRUNC('MONTH', month_date)\r\
  \nLIMIT 50000;"
